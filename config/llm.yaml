# The frontier LLM under comparison, called through OpenRouter's OpenAI-compatible API
# using a TypeScript port of TypeSafe's system-one-adapter-python (probabilities mode).
provider: openrouter
base_url: https://openrouter.ai/api/v1
# gpt-4o: GPT-6 Astra returns OpenAI 403 policy blocks for this OpenRouter key.
model: openai/gpt-4o
# No reasoning parameter is sent, so the provider's default reasoning setting applies.
reasoning: provider_default

# Dataset generation uses a different model family than the one being evaluated,
# so the evaluated LLM is not grading text it wrote itself.
dataset_generator_model: anthropic/claude-opus-5.5
